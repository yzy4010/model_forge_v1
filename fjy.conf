server {
    listen       8000;
    server_name  localhost;
	
	# 允许来自所有域的跨域请求
	add_header 'Access-Control-Allow-Origin' '*';
	# 允许的方法，如GET, POST等
	add_header 'Access-Control-Allow-Methods' '*';
	# 允许的头部，如Content-Type等
	add_header 'Access-Control-Allow-Headers' '*';
	# 预请求的缓存时间
	add_header 'Access-Control-Max-Age' 1728000;
	# 允许发送Cookie
	add_header 'Access-Control-Allow-Credentials' 'true';

    access_log  /data/log/nginx/host.access.log  main;
	#websocket相关配置
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header X-real-ip $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;

    location / {
	    root   /www/projects/fjy_ai/dist;
	    index  index.html index.htm;
	    try_files  $uri $uri/ /index.html;
    }
	
	location ^~ /prod-api/ {
		proxy_pass  http://localhost:8591/;
		proxy_set_header   Upgrade $http_upgrade;
		proxy_set_header   Connection keep-alive;
		proxy_set_header   Host $host:$server_port;
		proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header   X-Forwarded-Proto $scheme;
		proxy_set_header   X-Real-IP $remote_addr;
		proxy_cache_bypass $http_upgrade;
		client_max_body_size 100m;
	}

	location ~ /ISAPI|SDK/ {
		if ($http_cookie ~ "webVideoCtrlProxy=(.+)") {
			proxy_pass http://$cookie_webVideoCtrlProxy;
			break;
		}
	}
	location ^~ /webSocketVideoCtrlProxy {
		#web socket
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;

		if ($http_cookie ~ "webVideoCtrlProxyWs=(.+)") {
			proxy_pass http://$cookie_webVideoCtrlProxyWs/$cookie_webVideoCtrlProxyWsChannel?$args;
			break;
		}
		if ($http_cookie ~ "webVideoCtrlProxyWss=(.+)") {
			proxy_pass http://$cookie_webVideoCtrlProxyWss/$cookie_webVideoCtrlProxyWsChannel?$args;
			break;
		}
	}
}

